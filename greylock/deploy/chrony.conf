# /etc/chrony/chrony.conf — discipline the Pi's clock from the GNSS receiver's PPS so
# every ledger record is timestamped to microseconds.  Wire the receiver's TIMEPULSE
# to a GPIO (e.g. GPIO18) and enable the kernel PPS overlay:
#   /boot/firmware/config.txt:  dtoverlay=pps-gpio,gpiopin=18
# The coarse time (which second it is) comes from NMEA on a second serial port or from
# NTP over the network; PPS supplies the edge.

refclock PPS /dev/pps0 lock NMEA refid PPS precision 1e-7
refclock SHM 0 refid NMEA offset 0.2 delay 0.2 noselect   # gpsd NMEA, coarse, not selected
pool pool.ntp.org iburst                                   # fallback when the antenna is unplugged in a storm
makestep 1.0 3
rtcsync
driftfile /var/lib/chrony/drift
logdir /var/log/chrony
